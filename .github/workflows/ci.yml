name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Los runners de GitHub traen Docker, así que Testcontainers levanta PostgreSQL real
      - name: Build, tests y cobertura
        run: ./mvnw -B verify

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Construir imagen Docker
        run: docker build -t shopflow:${{ github.sha }} .
