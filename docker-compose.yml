# Stack completo: API + PostgreSQL + Mailpit (correos) + Prometheus + Grafana
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shopflow
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopflow"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"   # bandeja web: http://localhost:8025
      - "1025:1025"   # SMTP

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/shopflow
      DB_USER: shopflow
      DB_PASSWORD: shopflow
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      EMAIL_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shopflow.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345}
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
