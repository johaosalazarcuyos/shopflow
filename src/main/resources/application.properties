spring.application.name=shopflow
spring.threads.virtual.enabled=true

# --- Base de datos (PostgreSQL). Para desarrollo: `docker compose up -d db` o `./mvnw spring-boot:test-run`
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shopflow}
spring.datasource.username=${DB_USER:shopflow}
spring.datasource.password=${DB_PASSWORD:shopflow}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# --- Caché de productos
spring.cache.cache-names=products
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

# --- Correo (Mailpit en docker compose)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

# --- Observabilidad
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
# El chequeo de SMTP solo tiene sentido si el envío de correos está activo
management.health.mail.enabled=${EMAIL_ENABLED:false}

# --- Aplicación
app.timezone=America/Lima
app.currency=PEN
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==}
app.jwt.access-token-ttl=PT15M
app.jwt.refresh-token-ttl=P7D
app.orders.payment-timeout=PT30M
app.orders.expiration-check-interval=PT1M
app.shipping.flat-rate=10.00
app.shipping.free-threshold=200.00
app.admin.email=${ADMIN_EMAIL:admin@shopflow.dev}
app.admin.password=${ADMIN_PASSWORD:Admin12345}
app.notifications.email-enabled=${EMAIL_ENABLED:false}
app.notifications.from=ShopFlow <no-reply@shopflow.dev>
